# Template only — documents the Secret's shape. The real secret is never
# committed or applied from this file. Create it imperatively instead:
#
#   kubectl create secret generic openai-secret -n research-agent \
#     --from-literal=OPENAI_API_KEY="<value>"
#
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: research-agent
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
